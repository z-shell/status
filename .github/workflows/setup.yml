name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    if: ${{ vars.UPPTIME_WORKFLOW_TOKEN_CONFIGURED == 'true' }}
    permissions:
      actions: write
      contents: write
      issues: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - name: Update template
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - name: Update response time
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - name: Generate graphs
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          workflow: Graphs CI
          token: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - name: Generate site
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "digital-teams[Bot]"
          user_email: "actions@zshell.dev"
