name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Create Upptime app token
        id: upptime-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPPTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPPTIME_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.upptime-token.outputs.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@a9df8681951501693cbd6bea9c84df24bbf94210 # v1.43.16
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.upptime-token.outputs.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@a9df8681951501693cbd6bea9c84df24bbf94210 # v1.43.16
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.upptime-token.outputs.token }}
      - name: Generate graphs
        uses: upptime/uptime-monitor@a9df8681951501693cbd6bea9c84df24bbf94210 # v1.43.16
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ steps.upptime-token.outputs.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@a9df8681951501693cbd6bea9c84df24bbf94210 # v1.43.16
        with:
          command: "site"
        env:
          GH_PAT: ${{ steps.upptime-token.outputs.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        name: GitHub Pages Deploy
        with:
          github_token: ${{ steps.upptime-token.outputs.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "true"
          user_name: "digital-teams[Bot]"
          user_email: "actions@zshell.dev"
