name: Update Template CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ vars.UPPTIME_WORKFLOW_TOKEN_CONFIGURED == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
      - name: Update template
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.UPPTIME_WORKFLOW_TOKEN }}
