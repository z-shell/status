name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Create Upptime app token
        id: upptime-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPPTIME_APP_ID }}
          private-key: ${{ secrets.UPPTIME_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.upptime-token.outputs.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.upptime-token.outputs.token }}
